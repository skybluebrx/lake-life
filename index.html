<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lake Life</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family:sans-serif; }
body { background:#228B22; }
canvas { display:block; }
#menu {
  position:absolute; top:20px; right:20px; width:200px; background:rgba(255,255,255,0.9);
  border-radius:8px; padding:10px; font-size:14px; z-index:10;
}
#menu h3{margin:5px 0;}
#menu .level{cursor:pointer; margin:3px 0;}
#menu .minimize{cursor:pointer; font-size:12px; color:blue; text-decoration:underline;}
#popup {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:white; padding:20px; border-radius:10px; z-index:20; display:none; text-align:center;
}
#popup button {margin-top:10px;}
#zoomControls {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:10; background:rgba(255,255,255,0.8); border-radius:8px; padding:5px;
}
#zoomControls button {margin:0 5px;}
</style>
</head>
<body>
<canvas id="pond"></canvas>

<div id="menu">
  <h3>MENU</h3>
  <div>Level: <span id="levelDisplay">1</span></div>
  <div>Completion: <span id="percentDisplay">0%</span></div>
  <div id="unlockedLevels"></div>
  <div class="minimize" onclick="toggleMenu()">Minimize</div>
</div>

<div id="popup">
  <div id="popupText">WELCOME TO LAKE LIFE</div>
  <button id="startBtn">Start</button>
</div>

<div id="zoomControls">
  <button onclick="zoom(-0.05)">-</button>
  <button onclick="zoom(0.05)">+</button>
</div>

<script src="script.js"></script>
</body>
</html>

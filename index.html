<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lake Life</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: sans-serif;
    background-color: #5c8237; /* grass green */
  }

  #pondCanvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.8);
    border-radius: 5px;
    padding: 5px;
    z-index: 10;
  }

  #menu {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 200px;
    max-height: 400px;
    background: rgba(255,255,255,0.9);
    border-radius: 5px;
    overflow: hidden;
    transition: max-height 0.3s ease;
    z-index: 10;
  }

  #menu.collapsed {
    max-height: 40px;
    overflow: hidden;
  }

  #menuHeader {
    padding: 5px;
    background: #ccc;
    cursor: pointer;
    font-weight: bold;
  }

  #menuContent {
    padding: 5px;
  }

  .zoomBtn {
    display: inline-block;
    margin: 2px;
    padding: 5px 8px;
    cursor: pointer;
    background: #ccc;
    border-radius: 3px;
    user-select: none;
  }

  #levelPopup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.95);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 20;
    display: none;
  }

  #levelPopup button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }

  #panControls {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 10;
    display: flex;
    flex-direction: column;
  }

  .panRow {
    display: flex;
    justify-content: center;
  }

  .panBtn {
    margin: 2px;
    padding: 5px 8px;
    background: #ccc;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
  }

</style>
</head>
<body>
<canvas id="pondCanvas"></canvas>

<div id="ui">
  <span class="zoomBtn" id="zoomIn">+</span>
  <span class="zoomBtn" id="zoomOut">-</span>
</div>

<div id="menu" class="collapsed">
  <div id="menuHeader">MENU</div>
  <div id="menuContent">
    <div id="levelList"></div>
    <div id="levelProgress">Progress: 0%</div>
  </div>
</div>

<div id="levelPopup">
  <div id="popupText"></div>
  <button id="popupButton">Start</button>
</div>

<div id="panControls">
  <div class="panRow">
    <div class="panBtn" id="panUp">↑</div>
  </div>
  <div class="panRow">
    <div class="panBtn" id="panLeft">←</div>
    <div class="panBtn" id="panDown">↓</div>
    <div class="panBtn" id="panRight">→</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple Pond</title>
  <style>
    body { margin:0; overflow:hidden; }
    #levelPopup {
      display:none;
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      display:flex; justify-content:center; align-items:center;
    }
    #levelPopup div {
      background:white;
      padding:30px;
      border-radius:10px;
      text-align:center;
    }
    #levelPopup button {
      margin:10px;
      padding:10px 20px;
      cursor:pointer;
    }
    #muteBtn {
      position:absolute;
      top:10px;
      left:10px;
      z-index:10;
      padding:8px 15px;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <canvas id="pond"></canvas>
  <button id="muteBtn">Mute</button>

  <div id="levelPopup">
    <div>
      <h1>LEVEL COMPLETE</h1>
      <button id="nextLevelBtn">Next Level</button>
      <button id="closeBtn">X</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
